name: Build Windows app

# Runs when you publish a release, or when you click "Run workflow" on the Actions tab.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write   # needed only to attach the .exe to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the tests
        run: python -m unittest -v

      - name: Build the program
        run: |
          python -m pip install pyinstaller==6.10.0
          python -m PyInstaller --onefile --name CitationVerifier citation_verifier_app.py

      - name: Make a checksum so people can confirm their download
        shell: bash
        run: |
          cd dist
          sha256sum CitationVerifier.exe > CitationVerifier.exe.sha256.txt
          cat CitationVerifier.exe.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CitationVerifier-windows
          path: |
            dist/CitationVerifier.exe
            dist/CitationVerifier.exe.sha256.txt

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/CitationVerifier.exe dist/CitationVerifier.exe.sha256.txt --clobber
